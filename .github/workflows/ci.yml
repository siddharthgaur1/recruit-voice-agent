name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt ruff

      - name: Lint
        run: ruff check .

      # No API key and no Piper voice model on CI -- the suite is built to run
      # without either (LLM calls are faked, TTS tests skip when the model is
      # absent). If a test ever needs a real key, it belongs behind a marker,
      # not in this job.
      - name: Test
        run: pytest -q

      - name: End-to-end demo (no API key required)
        run: python demo.py
